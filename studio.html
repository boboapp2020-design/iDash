<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Sign-in gate. Runs before the page renders so protected content never
       flashes on screen for a signed-out visitor. -->
  <script src="js/auth.js?v=20260805h"></script>
  <script>if (!window.iDashAuth.requireSignIn()) { document.documentElement.style.display = 'none'; }</script>
  <title>Dashboard Studio — iDash</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/studio.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='18' width='6' height='12' rx='1' fill='%232563eb'/><rect x='10' y='12' width='6' height='18' rx='1' fill='%233b82f6'/><rect x='18' y='6' width='6' height='24' rx='1' fill='%2360a5fa'/><rect x='26' y='2' width='6' height='28' rx='1' fill='%2393c5fd'/></svg>">
</head>
<body>

<!-- ─── SIDEBAR ─── -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="18" width="6" height="12" rx="1.5" fill="#2563eb"/>
      <rect x="10" y="12" width="6" height="18" rx="1.5" fill="#3b82f6"/>
      <rect x="18" y="6" width="6" height="24" rx="1.5" fill="#60a5fa"/>
      <rect x="26" y="2" width="4" height="28" rx="1.5" fill="#93c5fd"/>
    </svg>
    <div>
      <span class="logo-text">iDash</span>
      <span class="logo-sub">AI Dashboard Intelligence Platform</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="index.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-user" id="sidebarUserTrigger">
      <div class="user-avatar">A</div>
      <div class="user-info">
        <div class="user-name">Bobo</div>
        <div class="user-role">Admin</div>
      </div>
      <div class="sidebar-user-menu" id="sidebarUserMenu" hidden>
        <button type="button" data-action="profile">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          โปรไฟล์
        </button>
        <button type="button" data-action="settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          ตั้งค่า
        </button>
        <div class="sidebar-user-menu-divider"></div>
        <button type="button" data-action="logout" class="danger">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          ออกจากระบบ
        </button>
      </div>
    </div>
  </div>
</aside>

<!-- ─── MAIN ─── -->
<main class="main">
  <div class="content">

    <div class="studio-header">
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        กลับหน้าแรก
      </a>
      <div class="studio-title-row">
        <div class="studio-title-main">
          <span id="studioDomainBadge" class="studio-domain-badge" hidden></span>
          <div>
            <h1 id="studioTitle">Dashboard</h1>
            <p id="studioSubtitle" class="studio-subtitle"></p>
          </div>
        </div>
        <div class="studio-title-row-right">
          <div class="studio-tabs" id="studioTabs"></div>
          <div class="studio-export" id="studioExport">
            <button class="studio-export-btn" id="studioExportBtn" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              ส่งออก
            </button>
            <div class="studio-export-menu" id="studioExportMenu" hidden>
              <button type="button" data-export="png"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>กราฟทั้งหมด (.png)</button>
              <button type="button" data-export="jpg"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>กราฟทั้งหมด (.jpg)</button>
              <button type="button" data-export="excel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>ข้อมูลตาราง (.xlsx)</button>
              <button type="button" data-export="pdf"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>พิมพ์ / บันทึกเป็น PDF</button>
              <button type="button" data-export="json"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>สำรอง Project (.json)</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Interactive filter bar (slicers) — populated by studio.js when the
         raw dataset is available for live recompute -->
    <div id="studioFilterBar" class="studio-filter-bar" hidden></div>

    <div id="studioEmpty" class="card studio-empty" hidden>
      <div class="studio-empty-title">ยังไม่มี Dashboard ให้แสดง</div>
      <div class="studio-empty-desc">กลับไปอัปโหลดไฟล์ข้อมูลที่หน้าแรกก่อน แล้ว AI จะสร้าง Dashboard ให้ที่นี่</div>
      <a href="index.html" class="studio-empty-cta">อัปโหลดข้อมูล</a>
    </div>

    <div id="studioPages"></div>

  </div>
</main>

<script src="vendor/echarts.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<!-- DET engines: live filter recompute re-runs ④⑤⑦ on the filtered rows -->
<script src="js/kpi_engine.js"></script>
<script src="js/decision_engine.js"></script>
<script src="js/style_library.js"></script>
<script src="js/composer.js"></script>
<script src="js/insight_engine.js"></script>
<script src="js/studio.js"></script>
<script src="js/sidebar.js"></script>
</body>
</html>
